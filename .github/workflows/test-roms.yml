# Runs the test ROMs people sent in the issues (tools/test-roms/roms.txt) on the
# branch and on the base it is compared with, and says which ones draw something
# different. Started by hand from the Actions tab (Run workflow: choose the branch
# to try and the base), and on pull requests that change the list or the scripts.
name: Test ROMs

on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch, tag or commit to compare with
        default: main
  pull_request:
    paths:
      - tools/test-roms/**
      - .github/workflows/test-roms.yml

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the base
        run: |
          base="${{ github.event.pull_request.base.sha || inputs.base || 'main' }}"
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || base="origin/$base"
          echo "Base: $base ($(git rev-parse --short "$base"))"
          git worktree add --detach ../base "$base"
      - name: Build both
        run: |
          for src in . ../base; do
            cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release -DPLUMSG_BUILD_FRONTEND=OFF
            cmake --build "$src/build" --parallel --target plumsg-headless
          done
      - name: Run the test ROMs
        run: |
          # The change's list and scripts drive both runs, so both run the same ROMs.
          tools/test-roms/run.sh ../base/build/plumsg-headless roms results/base
          tools/test-roms/run.sh build/plumsg-headless roms results/change
      - name: Compare
        run: python3 tools/test-roms/compare.py results/base results/change results/report.html "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: test-rom-report
          path: results
      - uses: actions/upload-artifact@v4
        with:
          name: test-roms
          path: roms
          retention-days: 3
      # TEMPORARY (removed before merge): testpico in the log, to try it outside CI.
      - name: Dump testpico
        run: tar -C roms -cJ testpico | base64 -w 0; echo
